name: test

on:
  # Pushes made by GITHUB_TOKEN (dependabot auto-merge) do not trigger the
  # push event, so without a schedule main is never tested after a merge.
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Test
        env:
          CONDUIT_ZENDESK_DOMAIN: ${{ secrets.CONDUIT_ZENDESK_DOMAIN }}
          CONDUIT_ZENDESK_USER_NAME: ${{ secrets.CONDUIT_ZENDESK_USER_NAME }}
          CONDUIT_ZENDESK_API_TOKEN: ${{ secrets.CONDUIT_ZENDESK_API_TOKEN }}
        run: make test GOTEST_FLAGS="-v -count=1"
